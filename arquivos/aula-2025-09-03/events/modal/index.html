<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>Document</title>
    <style>
        body {
            margin: 0;
            padding: 0;
        }

        .modal {
            display: none;
            z-index: 90;

            width: 100%;
            height: 100vh;
            background: rgba(0, 0, 0, 0.692);
            margin: 0;
            overflow-y: auto;
            top: 0;
            bottom: 0;
            position: fixed;
            padding: 2rem;
            opacity: var(--local-opacity, 0);
            /* opacity: 0; */
            /* opacity: 0.1; */
            /* opacity: 0.2; */
            /* opacity: 0.3; */
            /* opacity: 0.4; */
            /* opacity: 0.5; */
            /* opacity: 0.6; */
            /* opacity: 0.7; */
            /* opacity: 0.8; */
            /* opacity: 1; */
        }

        .modal.show {
            display: block;
        }

        .modal .modal-content {
            z-index: 100;
            position: relative;
            background: white;
            padding: 0 0.5rem;
            width: 90%;
            height: 70vh;
            margin-left: auto;
            margin-right: auto;
            border: 1px sold red;
            overflow-y: auto;
            padding-bottom: 0.5rem;
        }
    </style>
</head>

<body>

    <div>
        <button
            type="button"
            data-id="modalToggle"
        >Abrir/fechar modal</button>
    </div>

    <div
        class="modal"
        data-id="myModal"
    >
        <div class="modal-content">
            <div>
                <h2>Header</h2>
            </div>
            <div>
                <h3>Body</h3>
                <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. possimus, dolorum fuga, quae iste nobis hic
                    nisi ipsum!</p>
            </div>
            <div>
                <h5>Footer</h5>
                <div>
                    <button
                        type="button"
                        data-id="modalToggle"
                    >Fechar modal</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const modalEl = document.querySelector('div[data-id="myModal"]');
        const modalContentEl = document.querySelector('div[data-id="myModal"] .modal-content');

        const getModalOpacityValue = function (defaultValue = null) {
            if (!modalEl) {
                return defaultValue;
            }

            let value = Number(modalEl.style.getPropertyValue('--local-opacity') || 0);

            value = isNaN(value) ? value : null;

            if (value === null) {
                return defaultValue;
            }

            if (value < 0 || value > 1) {
                return value < 0 ? 0 : 1;
            }

            return value;
        }

        async function incrementModalOpacity() {
            let modalOpacityValue = getModalOpacityValue(0);

            let intervalId = null;

            return new Promise((resolve, reject) => {
                intervalId = setInterval(() => {
                    modalOpacityValue += 0.1

                    if (modalOpacityValue > 1) {
                        clearInterval(intervalId);
                        return resolve(true);
                    }

                    modalEl.style.setProperty('--local-opacity', `${modalOpacityValue}`);
                }, 20);
            });
        }

        async function decrementModalOpacity() {
            return new Promise((resolve, reject) => {
                let modalOpacityValue = getModalOpacityValue(1);
                let intervalId = null;
                intervalId = setInterval(() => {
                    modalOpacityValue -= 0.1

                    if (modalOpacityValue < 0) {
                        clearInterval(intervalId);
                        return resolve(true);
                    }

                    modalEl.style.setProperty('--local-opacity', `${modalOpacityValue}`);
                }, 20);
            });
        }

        const toggleModal = function (params) {
            if (!modalEl) {
                return;
            }

            let toShow = !modalEl?.classList?.contains('show');

            if (toShow) {
                modalEl?.classList?.add('show');
                incrementModalOpacity();
                return;
            }

            decrementModalOpacity().then((res) => {
                console.log('res', res);
                modalEl?.classList?.remove('show');
            });
            return;

            // modalEl?.classList?.toggle('show');
        }

        document.addEventListener('DOMContentLoaded', (event) => {
            document.querySelectorAll('button[data-id="modalToggle"]')?.forEach(toggleButton => {
                toggleButton?.addEventListener('click', toggleModal);
            });
        });
    </script>
</body>

</html>
